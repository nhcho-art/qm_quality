<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMW Quality Dashboard v2.2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F1E3C;--blue:#2563EB;--teal:#0D9488;--amber:#D97706;
  --red:#DC2626;--green:#16A34A;--purple:#7C3AED;--orange:#EA580C;
  --bg:#F0F4F8;--card:#FFFFFF;--card2:#F8FAFC;
  --border:#CBD5E1;--border2:#E2E8F0;
  --text:#0F172A;--text2:#334155;--text3:#64748B;--text4:#94A3B8;
  --sb-w:220px;--sh:0 1px 4px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.05);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px}

/* ── 사이드바 ── */
.sidebar{width:var(--sb-w);min-height:100vh;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100;overflow-y:auto}
.sb-logo{padding:22px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand{font-size:15px;font-weight:800;color:#fff;display:flex;align-items:center;gap:9px}
.brand-dot{width:9px;height:9px;background:var(--red);border-radius:50%;box-shadow:0 0 10px rgba(220,38,38,.7);flex-shrink:0}
.brand-sub{font-size:9.5px;color:rgba(255,255,255,.32);margin-top:3px;font-family:'JetBrains Mono',monospace}
.sb-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:2px}
.sb-sec{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:1.2px;text-transform:uppercase;padding:12px 10px 5px}
.nb{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:9px;border:none;background:transparent;color:rgba(255,255,255,.5);font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;width:100%;text-align:left}
.nb:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9)}
.nb.on{background:rgba(220,38,38,.22);color:#fff;font-weight:700}
.nb.on .nbi{color:#FCA5A5}
.nbi{font-size:14px;width:18px;text-align:center;flex-shrink:0}

/* 필터 */
.sb-filter{padding:12px 12px 8px;border-top:1px solid rgba(255,255,255,.08)}
.sb-filter-lbl{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:block}
.sf-group{margin-bottom:9px}
.sf-glbl{font-size:10px;color:rgba(255,255,255,.38);margin-bottom:4px;display:block}
.sf-btns{display:flex;flex-wrap:wrap;gap:3px}
.sfbtn{padding:3px 8px;border-radius:5px;font-size:10px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,255,255,.45);transition:all .12s;font-family:'Noto Sans KR',sans-serif}
.sfbtn:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.9)}
.sfbtn.on{background:rgba(220,38,38,.32);color:#fff;border-color:rgba(220,38,38,.45)}

/* 하단 */
.sb-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08)}
.sb-kpi{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px}
.sb-ki{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:7px 9px}
.sb-kv{font-size:14px;font-weight:700;color:#fff;font-family:'JetBrains Mono',monospace;display:block}
.sb-kl{font-size:9px;color:rgba(255,255,255,.3);display:block;margin-top:1px}
.sb-time{font-size:9.5px;color:rgba(255,255,255,.2);text-align:center;font-family:'JetBrains Mono',monospace;margin-bottom:6px}
.sb-btn{width:100%;padding:7px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1);border-radius:7px;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.sb-btn:hover{background:rgba(255,255,255,.13);color:#fff}

/* ── 메인 ── */
.main{margin-left:var(--sb-w);min-height:100vh}
.topbar{background:var(--card);border-bottom:2px solid var(--border);padding:0 28px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:50;box-shadow:var(--sh)}
.topbar-title{font-size:15px;font-weight:700;color:var(--text);flex:1}
.topbar-title span{font-size:11px;color:var(--text3);font-weight:400;margin-left:8px}
.filter-info{font-size:11px;color:var(--text4);font-family:'JetBrains Mono',monospace}
.tbtn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s}
.tbtn:hover{background:var(--bg)}

.page-wrap{padding:20px 24px;position:relative;overflow:hidden}
.pg{visibility:hidden;position:absolute;width:calc(100% - 220px);pointer-events:none;animation:fadeIn .2s ease}
.pg.on{visibility:visible;position:relative;width:100%;pointer-events:auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── 카드 ── */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ct{font-size:13px;font-weight:700;color:var(--text)}
.cs{font-size:11px;color:var(--text3);font-weight:400;margin-left:6px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-blue{background:#EFF6FF;color:var(--blue)}
.b-red{background:#FEF2F2;color:var(--red)}
.b-green{background:#F0FDF4;color:var(--green)}
.b-amber{background:#FFFBEB;color:var(--amber)}
.b-gray{background:var(--card2);color:var(--text3)}
.b-purple{background:#F5F3FF;color:var(--purple)}

/* ── 섹션 구분선 ── */
.section-divider{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.section-divider .sd-line{flex:1;height:1.5px;background:var(--border2)}
.section-divider .sd-label{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}

/* ── KPI 그리드 ── */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(15,30,60,.14)}
.kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.acc-red{background:var(--red)}
.acc-amber{background:var(--amber)}
.acc-blue{background:var(--blue)}
.acc-green{background:var(--green)}
.acc-purple{background:var(--purple)}
.acc-teal{background:var(--teal)}
.kpi-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.kpi-val{font-size:26px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace;line-height:1}
.kpi-val.sm{font-size:16px;margin-top:2px}
.kpi-sub{font-size:11px;color:var(--text4);margin-top:6px}
.kpi-sub b{font-weight:700}
.kpi-sub .up{color:var(--red)}
.kpi-sub .dn{color:var(--green)}
.gauge-bar{height:4px;background:var(--border2);border-radius:2px;overflow:hidden;margin-top:7px}
.gauge-fill{height:100%;border-radius:2px;transition:width .6s ease}
.gauge-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text4);margin-top:2px;font-family:'JetBrains Mono',monospace}

/* ── 그리드 레이아웃 ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.g3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:14px}
.mb14{margin-bottom:14px}

/* ── 차트 ── */
.h160{position:relative;height:160px}
.h200{position:relative;height:200px}
.h240{position:relative;height:240px}
.h280{position:relative;height:280px}
.h320{position:relative;height:320px}

/* ── 테이블 ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--card2);padding:9px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);border-bottom:1.5px solid var(--border);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#F8FAFC}
.mono{font-family:'JetBrains Mono',monospace;font-size:11.5px}
.tr{text-align:right}.tc{text-align:center}

/* ── 인라인 바 ── */
.ibar{display:flex;align-items:center;gap:7px}
.itrack{flex:1;height:5px;background:var(--border2);border-radius:3px;overflow:hidden;min-width:50px}
.ifill{height:100%;border-radius:3px;background:var(--blue)}
.ifill-red{background:var(--red)}
.ifill-amber{background:var(--amber)}

/* ── 태그 ── */
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:500}
.tg-blue{background:#EFF6FF;color:var(--blue)}
.tg-red{background:#FEF2F2;color:var(--red)}
.tg-amber{background:#FFFBEB;color:var(--amber)}
.tg-green{background:#F0FDF4;color:var(--green)}
.tg-gray{background:var(--card2);color:var(--text3)}
.tg-purple{background:#F5F3FF;color:var(--purple)}

/* ── 신호등 ── */
.sig{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700}
.sig-dot{width:7px;height:7px;border-radius:50%}
.sig-r{color:var(--red)}.sig-r .sig-dot{background:var(--red)}
.sig-a{color:var(--amber)}.sig-a .sig-dot{background:var(--amber)}
.sig-g{color:var(--green)}.sig-g .sig-dot{background:var(--green)}

/* ── 순위 ── */
.rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10.5px;font-weight:800}
.rk1{background:#FEF3C7;color:#D97706}
.rk2{background:#F1F5F9;color:#475569}
.rk3{background:#FEF2F2;color:var(--red)}
.rkn{background:var(--card2);color:var(--text4)}

/* ── 파레토 ── */
.pareto-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border2)}
.pareto-item:last-child{border-bottom:none}
.pareto-name{font-size:12px;font-weight:500;flex:1}
.pareto-bar{flex:1.2;height:5px;background:var(--border2);border-radius:3px;overflow:hidden}
.pareto-fill{height:100%;background:var(--red);border-radius:3px}
.pareto-cnt{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;min-width:28px;text-align:right}
.pareto-pct{font-size:10.5px;color:var(--text3);font-family:'JetBrains Mono',monospace;min-width:36px;text-align:right}
.pareto-cum{font-size:10.5px;color:var(--blue);font-family:'JetBrains Mono',monospace;min-width:36px;text-align:right}

/* ── 타이밍 레전드 ── */
.timing-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
.timing-legend{display:flex;flex-direction:column;gap:7px}
.timing-item{display:flex;align-items:center;gap:8px}
.timing-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.timing-lbl{font-size:12px;flex:1;color:var(--text2)}
.timing-val{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--text)}
.timing-pct{font-size:10.5px;color:var(--text4);margin-left:3px}

/* ── MoM 바 ── */
.mom-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2)}
.mom-item:last-child{border-bottom:none}
.mom-month{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);min-width:46px}
.mom-cnt{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;min-width:32px;text-align:right}
.mom-bar-wrap{flex:1;position:relative;height:5px;background:var(--border2);border-radius:3px}
.mom-bar-pos{position:absolute;top:0;height:100%;background:var(--red);border-radius:3px}
.mom-bar-neg{position:absolute;top:0;height:100%;background:var(--green);border-radius:3px}
.mom-change{font-size:10.5px;font-weight:700;min-width:42px;text-align:right;font-family:'JetBrains Mono',monospace}
.mom-change.up{color:var(--red)}.mom-change.dn{color:var(--green)}

/* ── 채널 카드 ── */
.channel-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ch-card{background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.ch-name{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:6px}
.ch-num{font-size:26px;font-weight:800;font-family:'JetBrains Mono',monospace}
.ch-pct{font-size:10.5px;color:var(--text4);margin-top:3px}
.ch-bar{height:4px;border-radius:2px;margin-top:8px;background:currentColor;opacity:.6}

/* ── 히트맵 ── */
.hmap{text-align:center;font-size:11.5px;font-family:'JetBrains Mono',monospace;font-weight:700}

/* ── SKU 신호등 리스트 ── */
.sku-sig-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border2)}
.sku-sig-item:last-child{border-bottom:none}

/* ── 로딩
